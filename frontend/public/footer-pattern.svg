<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <defs>
    <!-- Hagerawi mini-radar tile: one small logo motif per tile —
         green rings + a gold clock-hand line rising to the upper right,
         exactly like the logo. Motif is self-contained so tiling is
         automatically seamless. -->
    <pattern id="radar-mini" width="150" height="150" patternUnits="userSpaceOnUse">
      <!-- outer faint ring (logo's outer circle) -->
      <circle cx="75" cy="75" r="66" fill="none" stroke="#8DC63F" stroke-width="0.8" opacity="0.07"/>
      <!-- main ring (logo's bold circle) -->
      <circle cx="75" cy="75" r="48" fill="none" stroke="#8DC63F" stroke-width="1.2" opacity="0.14"/>

      <!-- clock-hand line: center dot -> up-right, like the logo's hand -->
      <g stroke="#F0B445" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.34">
        <path d="M75 75 L114 36"/>
        <!-- small arrowhead, like the logo -->
        <path d="M114 36 L103 37.5" opacity="0.9"/>
        <path d="M114 36 L112.5 47" opacity="0.9"/>
      </g>
      <!-- center node dot -->
      <circle cx="75" cy="75" r="3" fill="#F0B445" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="150" height="150" fill="url(#radar-mini)"/>
</svg>
