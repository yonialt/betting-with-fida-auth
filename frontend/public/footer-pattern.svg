<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <defs>
    <!-- Hagerawi footer tile — derived strictly from the hagerawi logo motif:
         ONE circle + ONE ascending line with arrowhead, exactly as in the logo.
         Color scheme matches quranenc.com's footer texture: monochrome slate-gray
         at low opacity (their footer-bg.svg is a single #203239->#141E27 artwork
         at 0.18 opacity) so the pattern reads as a subtle tone-on-tone texture,
         not a colorful brand element. -->
    <pattern id="hagerawi-motif" width="150" height="150" patternUnits="userSpaceOnUse">
      <!-- the circle (logo's ring) -->
      <circle cx="75" cy="75" r="34" fill="none" stroke="#8A98A8" stroke-width="2.4" opacity="0.18"/>

      <!-- the line (logo's trend polyline: rises through the circle center) -->
      <g stroke="#8A98A8" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
        <path d="M44.4 93 L60.6 78.6 L75 75 L96.6 60.6 L118.2 46.2"/>
        <!-- arrowhead at the tip, matching the logo's marker -->
        <path d="M113.2 53.1 L118.2 46.2 L109.8 48.1"/>
      </g>
    </pattern>
  </defs>

  <rect width="150" height="150" fill="url(#hagerawi-motif)"/>
</svg>
