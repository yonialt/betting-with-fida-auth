services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fidabet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fidabet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  fidabet-backend:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      API_FOOTBALL_SYNC_ENABLED: ${API_FOOTBALL_SYNC_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/fidabet}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://hagerawi.click,http://localhost:3000,http://107.23.159.58,http://107.23.159.58:3000}
    volumes:
      - fidabet-data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  fidabet-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - fidabet-backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  fidabet-data: