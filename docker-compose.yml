services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  fidabet-backend:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  fidabet-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - fidabet-backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  redis-data: