server:
  port: 8080

spring:
  application:
    name: fida-bet-backend
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fidabet}
    username: ${DB_USERNAME:fida}
    password: ${DB_PASSWORD:fida_secret_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fidabet-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

fayda:
  base-url: https://id.gov.et
  client-id: ${FAYDA_CLIENT_ID:}
  client-secret: ${FAYDA_CLIENT_SECRET:}
  partner-api-key: ${FAYDA_PARTNER_API_KEY:}
  mock: ${FAYDA_MOCK:true}

fidabet:
  jwt:
    # 256-bit secure secret key
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 15 minutes access token per specification
    access-token-expiration-ms: 900000
    # 7 days refresh token per specification
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  payments:
    telebirr:
      # Sandbox mode (switch to false for production)
      sandbox: ${TELEBIRR_SANDBOX:true}
      # Fabric App ID from Telebirr developer portal
      fabric-app-id: c4182ef8-9249-458a-985e-06d191f4d505
      # App Secret for fabric token authentication
      app-secret: fad0f06383c6297f545876694b974599
      # Merchant App ID
      merchant-app-id: "1690365349145601"
      # 6-digit Merchant Code
      merchant-code: "614629"
      # RSA Private Key (PEM or bare base64 DER) for signing requests
      private-key: 
      # Telebirr's public key for verifying webhook signatures
      public-key: 
      # Server-to-server notification URL (must be publicly reachable)
      notify-url: http://localhost:8080/webhook/telebirr
      # User return URL after payment
      redirect-url: http://localhost:5173/payment/return
    santimpay:
      merchant-id: ${SANTIMPAY_MERCHANT_ID:santim_fida_id}
      private-key: ${SANTIMPAY_PRIVATE_KEY:santim_key_secret}
    arifpay:
      api-key: ${ARIFPAY_API_KEY:arifpay_key_secret}
    dashen:
      merchant-code: ${DASHEN_MERCHANT_CODE:dashen_code_secret}

polymarket:
  gamma:
    base-url: https://gamma-api.polymarket.com
    timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fidabet: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
---
# In-memory development profile (runs standalone without external PostgreSQL/Redis required)
spring:
  config:
    activate:
      on-profile: dev-h2
  datasource:
    url: jdbc:h2:mem:fidabet;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  flyway:
    enabled: false
