# Test-only overrides: run against in-memory H2 so mvn test needs no external PostgreSQL.
# Production configuration lives in application.yml (PostgreSQL via environment variables).
spring:
  datasource:
    url: jdbc:h2:mem:fidabet-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Hibernate must use the H2 dialect even in PostgreSQL-compat mode, otherwise it emits
    # PostgreSQL-style "insert ... returning id" which this H2 version rejects.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
