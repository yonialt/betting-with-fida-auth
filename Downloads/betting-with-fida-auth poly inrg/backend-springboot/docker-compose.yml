version: '3.8'

services:
  # Distributed In-Memory Cache & Key-Value Store
  redis:
    image: redis:7.2-alpine
    container_name: fidabet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 60 1
      --loglevel notice
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Spring Boot 3 Backend Service
  fidabet-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fidabet-springboot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - API_FOOTBALL_PROVIDER=${API_FOOTBALL_PROVIDER:-api-sports}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
    driver: local
