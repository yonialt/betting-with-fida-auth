name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_FRONTEND: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  ECR_REPOSITORY_BACKEND: ${{ vars.ECR_BACKEND_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ vars.EC2_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933858446201:role/GitHubActionsECRRole
    aws-region: us-east-1

      # --------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # IMAGE TAG
      # --------------------------------------------------
      - name: Set deployment tag
        run: echo "DEPLOY_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # FRONTEND
      # --------------------------------------------------
      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest" \
            ./frontend

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest"

      # --------------------------------------------------
      # BACKEND
      # --------------------------------------------------
      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          docker build \
            --file backend-springboot/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest" \
            ./backend-springboot

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest"

      # --------------------------------------------------
      # DEPLOY TO EC2
      # --------------------------------------------------
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
          DEPLOY_DIR: /home/${{ env.EC2_USERNAME }}/fida-bet
        run: |

          # Create SSH key
          mkdir -p "$HOME/.ssh"

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/ec2_key"

          chmod 600 "$HOME/.ssh/ec2_key"

          # ------------------------------------------------
          # Create deployment directory on EC2
          # ------------------------------------------------
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p '$DEPLOY_DIR'"

          # ------------------------------------------------
          # Create docker-compose.ec2.yml
          # ------------------------------------------------
          cat > docker-compose.ec2.yml <<EOF
          services:

            redis:
              image: redis:7-alpine
              ports:
                - "6379:6379"
              volumes:
                - redis-data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 3s
                retries: 5
              restart: unless-stopped

            fidabet-backend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG}
              depends_on:
                redis:
                  condition: service_healthy
              environment:
                REDIS_HOST: redis
                REDIS_PORT: 6379
                API_FOOTBALL_KEY: \${API_FOOTBALL_KEY:-}
              ports:
                - "8080:8080"
              restart: unless-stopped

            fidabet-frontend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:${IMAGE_TAG}
              depends_on:
                - fidabet-backend
              ports:
                - "3000:80"
              restart: unless-stopped

          volumes:
            redis-data:
          EOF

          # ------------------------------------------------
          # Copy compose file to EC2
          # ------------------------------------------------
          scp \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=no \
            docker-compose.ec2.yml \
            "$EC2_USERNAME@$EC2_HOST:$DEPLOY_DIR/docker-compose.ec2.yml"

          rm -f docker-compose.ec2.yml

          # ------------------------------------------------
          # Deploy on EC2
          # ------------------------------------------------
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "ECR_REGISTRY='$ECR_REGISTRY' \
             ECR_REPOSITORY_FRONTEND='$ECR_REPOSITORY_FRONTEND' \
             ECR_REPOSITORY_BACKEND='$ECR_REPOSITORY_BACKEND' \
             IMAGE_TAG='$IMAGE_TAG' \
             AWS_REGION='$AWS_REGION' \
             DEPLOY_DIR='$DEPLOY_DIR' \
             bash -s" <<'DEPLOYEOF'

            set -e

            echo "========================================="
            echo "Deploying FidaBet"
            echo "========================================="

            cd "$DEPLOY_DIR"

            echo "AWS Region: $AWS_REGION"
            echo "Image tag: $IMAGE_TAG"

            # ------------------------------------------------
            # Login to ECR
            # ------------------------------------------------
            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            # ------------------------------------------------
            # Pull exact new images
            # ------------------------------------------------
            echo "Pulling frontend image..."

            docker pull \
              "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG"

            echo "Pulling backend image..."

            docker pull \
              "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG"

            # ------------------------------------------------
            # Start/recreate containers
            # ------------------------------------------------
            echo "Starting containers..."

            docker compose \
              -f docker-compose.ec2.yml \
              down

            docker compose \
              -f docker-compose.ec2.yml \
              up -d \
              --remove-orphans

            # ------------------------------------------------
            # Cleanup old images
            # ------------------------------------------------
            echo "Cleaning old Docker images..."

            docker image prune -f

            # ------------------------------------------------
            # Show status
            # ------------------------------------------------
            echo "========================================="
            echo "Running containers"
            echo "========================================="

            docker ps \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "========================================="
            echo "Deployment complete"
            echo "========================================="

          DEPLOYEOF