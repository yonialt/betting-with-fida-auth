name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_FRONTEND: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
  ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_BACKEND_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # DEBUG GITHUB OIDC
      # --------------------------------------------------
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('Repository:', payload.repository);
            console.log('Repository owner:', payload.repository_owner);
            console.log('Ref:', payload.ref);
            console.log('Repository ID:', payload.repository_id);
            console.log('Repository owner ID:', payload.repository_owner_id);

      # --------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933858446201:role/GitHubActionsECRRole
          aws-region: us-east-1

      # --------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # IMAGE TAG
      # --------------------------------------------------
      - name: Set deployment tag
        run: echo "DEPLOY_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # BUILD AND PUSH FRONTEND
      # --------------------------------------------------
      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          echo "Building frontend..."

          docker build \
            --file frontend/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest" \
            ./frontend

          echo "Pushing frontend..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest"

      # --------------------------------------------------
      # BUILD AND PUSH BACKEND
      # --------------------------------------------------
      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          echo "Building backend..."

          docker build \
            --file backend-springboot/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest" \
            ./backend-springboot

          echo "Pushing backend..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest"

      # --------------------------------------------------
      # DEPLOY TO EC2
      # --------------------------------------------------
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
          DEPLOY_DIR: /home/${{ env.EC2_USERNAME }}/fida-bet
        run: |

          echo "========================================="
          echo "Preparing EC2 deployment"
          echo "========================================="

          # ------------------------------------------------
          # CREATE SSH KEY
          # ------------------------------------------------
          mkdir -p "$HOME/.ssh"

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" \
            > "$HOME/.ssh/ec2_key"

          chmod 600 "$HOME/.ssh/ec2_key"

          # ------------------------------------------------
          # CREATE DEPLOYMENT DIRECTORY
          # ------------------------------------------------
          echo "Creating deployment directory..."

          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p '$DEPLOY_DIR'"

          # ------------------------------------------------
          # CREATE DOCKER COMPOSE FILE
          # ------------------------------------------------
          echo "Creating docker-compose.ec2.yml..."

          cat > docker-compose.ec2.yml <<EOF
          services:

            redis:
              image: redis:7-alpine
              ports:
                - "6379:6379"
              volumes:
                - redis-data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 3s
                retries: 5
              restart: unless-stopped

            fidabet-backend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG}
              depends_on:
                redis:
                  condition: service_healthy
              environment:
                REDIS_HOST: redis
                REDIS_PORT: 6379
                API_FOOTBALL_KEY: \${API_FOOTBALL_KEY:-}
              ports:
                - "8080:8080"
              restart: unless-stopped

            fidabet-frontend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:${IMAGE_TAG}
              depends_on:
                - fidabet-backend
              ports:
                - "3000:80"
              restart: unless-stopped

          volumes:
            redis-data:
          EOF

          # ------------------------------------------------
          # COPY COMPOSE FILE TO EC2
          # ------------------------------------------------
          echo "Copying Docker Compose file to EC2..."

          scp \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=no \
            docker-compose.ec2.yml \
            "$EC2_USERNAME@$EC2_HOST:$DEPLOY_DIR/docker-compose.ec2.yml"

          rm -f docker-compose.ec2.yml

          # ------------------------------------------------
          # DEPLOY ON EC2
          # ------------------------------------------------
          echo "Starting EC2 deployment..."

          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "ECR_REGISTRY='$ECR_REGISTRY' \
             ECR_REPOSITORY_FRONTEND='$ECR_REPOSITORY_FRONTEND' \
             ECR_REPOSITORY_BACKEND='$ECR_REPOSITORY_BACKEND' \
             IMAGE_TAG='$IMAGE_TAG' \
             AWS_REGION='$AWS_REGION' \
             DEPLOY_DIR='$DEPLOY_DIR' \
             bash -s" <<'DEPLOYEOF'

            set -e

            echo "========================================="
            echo "FidaBet Deployment"
            echo "========================================="

            cd "$DEPLOY_DIR"

            echo "AWS Region: $AWS_REGION"
            echo "Image tag: $IMAGE_TAG"

            # ------------------------------------------------
            # LOGIN TO ECR
            # ------------------------------------------------
            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            # ------------------------------------------------
            # PULL FRONTEND
            # ------------------------------------------------
            echo "Pulling frontend image..."

            docker pull \
              "$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG"

            # ------------------------------------------------
            # PULL BACKEND
            # ------------------------------------------------
            echo "Pulling backend image..."

            docker pull \
              "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG"

            # ------------------------------------------------
            # STOP OLD CONTAINERS
            # ------------------------------------------------
            echo "Stopping old containers..."

            docker compose \
              -f docker-compose.ec2.yml \
              down

            # ------------------------------------------------
            # START NEW CONTAINERS
            # ------------------------------------------------
            echo "Starting new containers..."

            docker compose \
              -f docker-compose.ec2.yml \
              up -d \
              --remove-orphans

            # ------------------------------------------------
            # CLEAN OLD IMAGES
            # ------------------------------------------------
            echo "Cleaning unused Docker images..."

            docker image prune -f

            # ------------------------------------------------
            # SHOW CONTAINER STATUS
            # ------------------------------------------------
            echo "========================================="
            echo "Running containers"
            echo "========================================="

            docker ps \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "========================================="
            echo "Deployment complete"
            echo "========================================="

          DEPLOYEOF