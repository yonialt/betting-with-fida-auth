name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_FRONTEND: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  ECR_REPOSITORY_BACKEND: ${{ vars.ECR_BACKEND_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ vars.EC2_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment tag
        run: echo "DEPLOY_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
        run: |
          docker build \
            --file backend-springboot/Dockerfile \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            ./backend-springboot
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_TAG }}
          DEPLOY_DIR: /home/$EC2_USERNAME/fida-bet
          ECR_REPOSITORY_FRONTEND: ${{ env.ECR_REPOSITORY_FRONTEND }}
          ECR_REPOSITORY_BACKEND: ${{ env.ECR_REPOSITORY_BACKEND }}
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > $HOME/.ssh/ec2_key
          chmod 600 $HOME/.ssh/ec2_key

          # Create .env file on EC2 if it doesn't exist (only needs to be done once)
          ssh -i $HOME/.ssh/ec2_key -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << 'SETUPEOF'
            set -e
            DEPLOY_DIR="/home/$EC2_USERNAME/fida-bet"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Create .env file for docker-compose if it doesn't exist
            if [ ! -f .env ]; then
              echo "ECR_REGISTRY=${ECR_REGISTRY}" > .env
              echo "ECR_REPOSITORY_FRONTEND=${ECR_REPOSITORY_FRONTEND}" >> .env
              echo "ECR_REPOSITORY_BACKEND=${ECR_REPOSITORY_BACKEND}" >> .env
              echo "Created .env file"
            fi
          SETUPEOF

          # Create docker-compose.ec2.yml locally with interpolated values and copy to EC2
          cat > docker-compose.ec2.yml <<'LOCALEOF'
          services:
            redis:
              image: redis:7-alpine
              ports:
                - "6379:6379"
              volumes:
                - redis-data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 3s
                retries: 5
              restart: unless-stopped

            fidabet-backend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:latest
              depends_on:
                redis:
                  condition: service_healthy
              environment:
                REDIS_HOST: redis
                REDIS_PORT: 6379
                API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
              ports:
                - "8080:8080"
              restart: unless-stopped

            fidabet-frontend:
              image: ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:latest
              depends_on:
                - fidabet-backend
              ports:
                - "3000:80"
              restart: unless-stopped

          volumes:
            redis-data:
          LOCALEOF

          sed -i "s|\${ECR_REGISTRY}|${ECR_REGISTRY}|g" docker-compose.ec2.yml
          sed -i "s|\${ECR_REPOSITORY_BACKEND}|${ECR_REPOSITORY_BACKEND}|g" docker-compose.ec2.yml
          sed -i "s|\${ECR_REPOSITORY_FRONTEND}|${ECR_REPOSITORY_FRONTEND}|g" docker-compose.ec2.yml

          scp -i $HOME/.ssh/ec2_key -o StrictHostKeyChecking=no docker-compose.ec2.yml $EC2_USERNAME@$EC2_HOST:$DEPLOY_DIR/docker-compose.ec2.yml
          rm -f docker-compose.ec2.yml

          # Main deployment
          ssh -i $HOME/.ssh/ec2_key -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << 'DEPLOYEOF'
            set -e

            DEPLOY_DIR="/home/$EC2_USERNAME/fida-bet"
            cd "$DEPLOY_DIR"

            # Load environment variables from .env file
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
            fi

            # Login to ECR
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            # Pull the new images
            docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:${IMAGE_TAG}
            docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG}

            # Tag as latest for local docker-compose use
            docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY_FRONTEND}:latest
            docker tag ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:latest

            # Recreate containers with new images
            docker compose -f docker-compose.ec2.yml pull
            docker compose -f docker-compose.ec2.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Show running containers
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          DEPLOYEOF
